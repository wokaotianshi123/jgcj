name: new Run Python Script

# 保留原有入口名：定时触发时调用 main.yml 里的统一流水线。
# 采集源 A / B 会在同一次运行里并行采集，然后在 merge 任务中合并去重，
# 生成 hongguo / libretv / zcying / zypcbox / zytvbox / zyvying 六份配置。
# 并发排队由 main.yml 中的 concurrency 统一控制，两个工作流不会互相覆盖结果。

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    name: 调用统一采集流水线
    uses: ./.github/workflows/main.yml
    secrets: inherit
